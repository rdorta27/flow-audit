name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with mise.toml.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.8"
      - run: deno task check
      - run: deno task test
      - run: deno lint
      - run: deno fmt --check
